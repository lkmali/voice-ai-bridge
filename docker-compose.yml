version: "3.8"

services:
  app:
    build: .
    image: voice-backend:latest
    restart: always
    expose:
      - "3000"
    env_file:
      - .env
    networks:
      - voice-net

  nginx:
    image: nginx:latest
    container_name: voice-nginx
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro   # Your nginx config
      - ./nginx/ssl:/etc/letsencrypt                 # SSL certificates
      - ./nginx/webroot:/var/www/html                # Certbot challenge folder
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    networks:
      - voice-net

  certbot:
    image: certbot/certbot
    container_name: voice-certbot
    command: >
      certonly --webroot
      --webroot-path=/var/www/html
      -d voice.aiplustechnology.com
      --email laxmanasawa9312@gmail.com
      --agree-tos
      --non-interactive
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - ./nginx/webroot:/var/www/html
    networks:
      - voice-net

networks:
  voice-net:
    driver: bridge
