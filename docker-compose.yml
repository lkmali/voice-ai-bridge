version: "3.8"
services:
  app:
    build: .
    image: voice-backend:latest
    restart: always
    expose:
      - "3000"
    env_file:
      - .env
    networks:
      - voice-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health" ]
      interval: 10s
      timeout: 2s
      retries: 5

  nginx:
    image: nginx:latest
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/letsencrypt
      - ./public:/var/www/frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    networks:
      - voice-net

networks:
  voice-net:
    driver: bridge
