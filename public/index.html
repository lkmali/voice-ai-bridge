<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <title>Voice AI Assistant</title>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>

        <style>
            :root {
                --bg: #ffffff;
                --bg-card: #f8fafc;
                --bg-alt: #f1f5f9;
                --border: #e2e8f0;
                --text: #0f172a;
                --subtext: #64748b;
                --accent: #0ea5e9;
                --user: #22c55e;
                --speaker: #818cf8;
            }
            body {
                font-family: system-ui;
                background: var(--bg);
                margin: 0;
                padding: 20px;
                display: flex;
                justify-content: center;
            }
            .wrapper {
                width: 100%;
                max-width: 900px;
            }
            #micButton {
                padding: 10px 20px;
                border-radius: 50px;
                font-size: 1rem;
                cursor: pointer;
                border: none;
                margin-bottom: 8px;
            }
            #micButton.listening {
                background: var(--user);
                color: #fff;
            }
            #micButton.thinking {
                background: var(--accent);
                color: #fff;
            }
            #micButton.speaking {
                background: var(--speaker);
                color: #fff;
            }
            #status {
                font-size: 0.85rem;
                color: var(--subtext);
            }
            .chat {
                background: var(--bg-alt);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 12px;
                height: 420px;
                overflow-y: auto;
                display: flex;
                flex-direction: column;
                gap: 6px;
                margin-top: 10px;
            }
            .msg {
                padding: 8px 12px;
                border-radius: 12px;
                max-width: 75%;
                white-space: pre-wrap;
            }
            .msg.user {
                background: var(--user);
                color: white;
                margin-left: auto;
            }
            .msg.assistant {
                background: white;
                border: 1px solid var(--border);
                color: var(--text);
            }
            .msg.typing {
                opacity: 0.7;
                font-style: italic;
            }
            /* Login Section Styles */
            #loginSection {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 300px;
                gap: 16px;
            }
            #loginSection h2 {
                color: var(--text);
                margin: 0 0 8px 0;
                font-weight: 600;
            }
            #loginSection p {
                color: var(--subtext);
                margin: 0 0 16px 0;
                font-size: 0.9rem;
            }
            .input-group {
                display: flex;
                gap: 12px;
                align-items: center;
            }
            #mobileInput {
                padding: 12px 16px;
                font-size: 1rem;
                border-radius: 12px;
                border: 2px solid var(--border);
                width: 240px;
                outline: none;
                transition: border-color 0.2s, box-shadow 0.2s;
                background: var(--bg-card);
            }
            #mobileInput:focus {
                border-color: var(--accent);
                box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
            }
            #mobileInput::placeholder {
                color: var(--subtext);
            }
            #startBtn {
                padding: 12px 24px;
                border-radius: 12px;
                font-size: 1rem;
                font-weight: 500;
                cursor: pointer;
                border: none;
                background: var(--accent);
                color: white;
                transition: background 0.2s, transform 0.1s;
            }
            #startBtn:hover {
                background: #0284c7;
            }
            #startBtn:active {
                transform: scale(0.98);
            }
        </style>
    </head>

    <body>
        <div class="wrapper">
            <div id="loginSection">
                <h2>Voice AI Assistant</h2>
                <p>Enter your mobile number to start</p>
                <div class="input-group">
                    <input type="tel" id="mobileInput" placeholder="Enter mobile number" />
                    <button id="startBtn">Start</button>
                </div>
            </div>
            <div id="chatSection" style="display: none;">
                <button id="micButton" class="listening">Tap to Speak</button>
                <div id="status">Connecting...</div>

                <div id="chat" class="chat"></div>
            </div>
        </div>

        <script>
            /* GLOBALS */
            let ws,
                audioCtx,
                scriptNode,
                mediaStream;
            let micOn = false;
            let playQueue = [];
            let playing = false;
            let playCtx = null;
            let assistantDraft = "";
            let userDraft = "";
            let state = "idle";
            let audioChunks = 0;
            let mobileNumber = "";

            // Typing indicator elements (created dynamically)
            let userTypingEl = null;
            let aiTypingEl = null;

            /* DOM */
            const loginSection = document.getElementById("loginSection");
            const chatSection = document.getElementById("chatSection");
            const mobileInput = document.getElementById("mobileInput");
            const startBtn = document.getElementById("startBtn");
            const micButton = document.getElementById("micButton");
            const statusEl = document.getElementById("status");
            const chatEl = document.getElementById("chat");

            /* WebSocket */
            let wsPath = "/exotel-media"; // default, will be fetched from server

            async function init() {
                // Fetch WebSocket path from server config
                try {
                    const res = await fetch("/api/config");
                    const config = await res.json();
                    wsPath = config.wsPath || wsPath;
                } catch (e) {
                    console.warn("Could not fetch config, using default path");
                }
            }

            function connectWS() {
                if (ws && ws.readyState === 1)
                    return;

                const u = (
                    location.protocol === "https:"
                    ? "wss:"
                    : "ws:") + "//" + location.host + wsPath;

                ws = new WebSocket(u);

                ws.onopen = () => {
                    // Send init message with mobile number as sessionId
                    ws.send(JSON.stringify({ type: "init", mobileNumber: mobileNumber }));
                    setStatus("Ready");
                };
                ws.onclose = () => setStatus("Disconnected");
                ws.onerror = () => setStatus("WS Error");
                ws.onmessage = (ev) => route(JSON.parse(ev.data));
            }

            // Handle start button click
            startBtn.addEventListener("click", () => {
                mobileNumber = mobileInput.value.trim();
                if (!mobileNumber) {
                    alert("Please enter a mobile number");
                    return;
                }
                loginSection.style.display = "none";
                chatSection.style.display = "block";
                connectWS();
            });

            init();

            /* State + UI */
            function setStatus(txt) {
                statusEl.textContent = txt;
            }

            function setMicState(newState) {
                state = newState;
                micButton.className = newState;
                if (newState === "listening")
                    micButton.textContent = "Listening...";
                if (newState === "thinking")
                    micButton.textContent = "Thinking...";
                if (newState === "speaking")
                    micButton.textContent = "Speaking...";
            }

            /* Chat UI */
            function addMsg(role, text) {
                const d = document.createElement("div");
                d.className = "msg " + role;
                d.textContent = text;
                chatEl.appendChild(d);
                chatEl.scrollTop = chatEl.scrollHeight;
            }

            function showUserTyping(text) {
                if (!userTypingEl) {
                    userTypingEl = document.createElement("div");
                    userTypingEl.className = "msg user typing";
                    chatEl.appendChild(userTypingEl);
                }
                userTypingEl.textContent = text;
                chatEl.scrollTop = chatEl.scrollHeight;
            }

            function hideUserTyping() {
                if (userTypingEl) {
                    userTypingEl.remove();
                    userTypingEl = null;
                }
            }

            function showAiTyping(text) {
                if (!aiTypingEl) {
                    aiTypingEl = document.createElement("div");
                    aiTypingEl.className = "msg assistant typing";
                    chatEl.appendChild(aiTypingEl);
                }
                aiTypingEl.textContent = text;
                chatEl.scrollTop = chatEl.scrollHeight;
            }

            function hideAiTyping() {
                if (aiTypingEl) {
                    aiTypingEl.remove();
                    aiTypingEl = null;
                }
            }

            /* Audio mic */
            async function toggleMic() {
                if (!micOn)
                    startMic();
                else
                    stopMic();
            }

            async function startMic() {
                connectWS();
                if (micOn)
                    return;

                if (playing)
                    interruptPlayback();

                mediaStream = await navigator
                    .mediaDevices
                    .getUserMedia({audio: true});
                audioCtx = new AudioContext({sampleRate: 24000});
                const src = audioCtx.createMediaStreamSource(mediaStream);
                scriptNode = audioCtx.createScriptProcessor(2048, 1, 1);

                scriptNode.onaudioprocess = (ev) => {
                    if (!micOn)
                        return;
                    if (!ws || ws.readyState !== WebSocket.OPEN)
                        return;

                    const input = ev
                        .inputBuffer
                        .getChannelData(0);
                    const pcm = floatToPCM(input);
                    ws.send(JSON.stringify({type: "audio", audio: pcmBase64(pcm)}));
                    audioChunks++;
                };

                src.connect(scriptNode);
                scriptNode.connect(audioCtx.destination);

                micOn = true;
                audioChunks = 0;
                setMicState("listening");
                setStatus("Listening...");
            }

            function stopMic() {
                micOn = false;

                // only send "audio_end" if we actually streamed some audio
                if (ws && ws.readyState === WebSocket.OPEN && audioChunks > 0) {
                    ws.send(JSON.stringify({type: "audio_end"}));
                }
                audioChunks = 0;

                if (scriptNode)
                    scriptNode.disconnect();
                scriptNode = null;

                if (audioCtx)
                    audioCtx.close();
                audioCtx = null;

                if (mediaStream) {
                    mediaStream
                        .getTracks()
                        .forEach((t) => t.stop());
                    mediaStream = null;
                }

                setMicState("thinking");
                setStatus("Processing...");
            }

            micButton.addEventListener("click", toggleMic);

            /* Audio Playback */
            function queue(samples) {
                playQueue.push(samples);
                if (!playing)
                    playNext();
            }

            function playNext() {
                if (!playQueue.length) {
                    playing = false;
                    setMicState("listening");
                    return;
                }

                playing = true;
                setMicState("speaking");

                if (!playCtx)
                    playCtx = new AudioContext({sampleRate: 24000});

                const samp = playQueue.shift();
                const buf = playCtx.createBuffer(1, samp.length, 24000);
                buf
                    .getChannelData(0)
                    .set(samp);
                const src = playCtx.createBufferSource();
                src.buffer = buf;
                src.connect(playCtx.destination);
                src.start();
                src.onended = () => {
                    playing = false;
                    playNext();
                };
            }

            function interruptPlayback() {
                playQueue = [];
                playing = false;
                setMicState("listening");
            }

            /* Decode AI Events */
            function route(msg) {
                if (msg.type === "ai")
                    handleAI(msg.evt);
                if (msg.type === "ready")
                    setStatus("Ready - Tap to Speak");
                if (msg.type === "error")
                    console.error("AI error:", msg.errInfo || msg);
            }

            function handleAI(e) {
                if (!e || !e.type)
                    return;
                const t = e.type;

                // Audio playback
                if (t === "response.output_audio.delta") {
                    const f = base64ToFloat(e.delta);
                    queue(f);
                }

                // AI transcript (real-time typing)
                if (t === "response.output_text.delta") {
                    assistantDraft += e.delta;
                    showAiTyping(assistantDraft);
                }

                // AI transcript complete
                if (t === "response.output_text.done") {
                    hideAiTyping();
                    if (assistantDraft.trim()) {
                        addMsg("assistant", assistantDraft.trim());
                    }
                    assistantDraft = "";
                }

                // Response complete
                if (t === "response.completed") {
                    hideAiTyping();
                    if (assistantDraft.trim()) {
                        addMsg("assistant", assistantDraft.trim());
                    }
                    assistantDraft = "";
                    setMicState("listening");
                    setStatus("Ready - Tap to Speak");
                }

                // User transcript (real-time typing)
                if (t === "conversation.item.input_audio_transcription.delta") {
                    userDraft += e.delta;
                    showUserTyping(userDraft);
                }

                // User transcript complete
                if (t === "conversation.item.input_audio_transcription.completed") {
                    hideUserTyping();
                    if (e.transcript && e.transcript.trim()) {
                        addMsg("user", e.transcript.trim());
                    } else if (userDraft.trim()) {
                        addMsg("user", userDraft.trim());
                    }
                    userDraft = "";
                }
            }

            /* Utils */
            function floatToPCM(f) {
                const out = new Int16Array(f.length);
                for (let i = 0; i < f.length; i++) {
                    const s = Math.max(-1, Math.min(1, f[i]));
                    out[i] = s < 0
                        ? s * 0x8000
                        : s * 0x7fff;
                }
                return out;
            }

            function pcmBase64(pcm) {
                return btoa(String.fromCharCode(...new Uint8Array(pcm.buffer)));
            }

            function base64ToFloat(b) {
                const bin = atob(b);
                const bytes = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++)
                    bytes[i] = bin.charCodeAt(i);
                const dv = new DataView(bytes.buffer);
                const len = bytes.byteLength / 2;
                const out = new Float32Array(len);
                for (let i = 0; i < len; i++) {
                    out[i] = dv.getInt16(i * 2, true) / 0x8000;
                }
                return out;
            }
        </script>
    </body>
</html>
