<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Exotel Voice AI Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      font-family: system-ui;
      background: #f8fafc;
      padding: 20px;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 999px;
      border: none;
      background: #22c55e;
      color: white;
      cursor: pointer;
    }
    #status {
      margin-top: 8px;
      color: #64748b;
    }
  </style>
</head>

<body>
  <button id="mic">🎙 Tap to Speak</button>
  <div id="status">Ready</div>

<script>
/* ================= STATE ================= */
let ws;
let micOn = false;
let audioCtx, processor, micStream;

let playCtx = null;
let playQueue = [];
let playing = false;

const streamSid = "browser-" + Date.now();

/* ================= UI ================= */
const micBtn = document.getElementById("mic");
const statusEl = document.getElementById("status");

/* ================= WS ================= */
function connectWS() {
  if (ws && ws.readyState === WebSocket.OPEN) return;

  ws = new WebSocket(
    (location.protocol === "https:" ? "wss://" : "ws://") +
    location.host +
    "/exotel-media"
  );

  ws.onmessage = e => route(JSON.parse(e.data));
}

connectWS();

/* ================= MIC ================= */
micBtn.onclick = () => micOn ? stopMic() : startMic();

async function startMic() {
  micOn = true;
  micBtn.textContent = "⏹ Stop";
  statusEl.textContent = "Listening";

  connectWS();

  ws.send(JSON.stringify({
    event: "start",
    stream_sid: streamSid
  }));

  micStream = await navigator.mediaDevices.getUserMedia({ audio: true });

  audioCtx = new AudioContext({ sampleRate: 8000 });
  await audioCtx.resume();

  const src = audioCtx.createMediaStreamSource(micStream);
  processor = audioCtx.createScriptProcessor(2048, 1, 1);

  processor.onaudioprocess = e => {
    if (!micOn) return;

    const input = e.inputBuffer.getChannelData(0);
    const pcm16 = floatToPCM16(input);

    ws.send(JSON.stringify({
      event: "media",
      stream_sid: streamSid,
      media: { payload: pcm16ToBase64(pcm16) }
    }));
  };

  src.connect(processor);
  processor.connect(audioCtx.destination);
}

function stopMic() {
  micOn = false;
  micBtn.textContent = "🎙 Tap to Speak";
  statusEl.textContent = "Processing";

  ws.send(JSON.stringify({
    event: "stop",
    stream_sid: streamSid
  }));

  processor?.disconnect();
  audioCtx?.close();
  micStream?.getTracks().forEach(t => t.stop());
}

/* ================= ROUTER ================= */
function route(msg) {
  if (msg.event === "media" && msg.media?.payload) {
    const pcm = base64ToPCM16(msg.media.payload);
    const float32 = pcm16ToFloat32(pcm);
    queue(float32);
  }
}

/* ================= PLAYBACK ================= */
function queue(samples) {
  playQueue.push(samples);
  if (!playing) playNext();
}

async function playNext() {
  if (!playQueue.length) {
    playing = false;
    statusEl.textContent = "Ready";
    return;
  }

  playing = true;
  statusEl.textContent = "Speaking 🔊";

  if (!playCtx) {
    playCtx = new AudioContext({ sampleRate: 8000 });
  }
  if (playCtx.state === "suspended") {
    await playCtx.resume();
  }

  const samples = playQueue.shift();
  const buf = playCtx.createBuffer(1, samples.length, 8000);
  buf.getChannelData(0).set(samples);

  const src = playCtx.createBufferSource();
  src.buffer = buf;
  src.connect(playCtx.destination);
  src.start();
  src.onended = playNext;
}

/* ================= AUDIO UTILS ================= */
function floatToPCM16(f) {
  const out = new Int16Array(f.length);
  for (let i = 0; i < f.length; i++) {
    const s = Math.max(-1, Math.min(1, f[i]));
    out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
  }
  return out;
}

function pcm16ToBase64(pcm) {
  return btoa(String.fromCharCode(...new Uint8Array(pcm.buffer)));
}

function base64ToPCM16(b64) {
  const bin = atob(b64);
  const buf = new Int16Array(bin.length / 2);
  for (let i = 0; i < buf.length; i++) {
    buf[i] = bin.charCodeAt(i * 2) | (bin.charCodeAt(i * 2 + 1) << 8);
  }
  return buf;
}

function pcm16ToFloat32(pcm) {
  const out = new Float32Array(pcm.length);
  for (let i = 0; i < pcm.length; i++) {
    out[i] = pcm[i] / 32768;
  }
  return out;
}
</script>
</body>
</html>
