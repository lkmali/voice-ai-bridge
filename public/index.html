<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Voice AI Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>

  <style>
    :root {
      --bg:#ffffff;
      --bg-alt:#f1f5f9;
      --border:#e2e8f0;
      --text:#0f172a;
      --subtext:#64748b;
      --user:#22c55e;
    }

    body {
      font-family: system-ui;
      background: var(--bg);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .wrapper {
      width: 100%;
      max-width: 900px;
    }

    #micButton {
      padding: 10px 20px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      background: var(--user);
      color: #fff;
    }

    #status {
      font-size: 0.85rem;
      color: var(--subtext);
      margin-top: 6px;
    }

    .chat {
      margin-top: 10px;
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      height: 420px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .msg {
      padding: 8px 12px;
      border-radius: 12px;
      max-width: 75%;
      white-space: pre-wrap;
    }

    .msg.user {
      background: var(--user);
      color: white;
      margin-left: auto;
    }

    .msg.assistant {
      background: white;
      border: 1px solid var(--border);
    }
  </style>
</head>

<body>
<div class="wrapper">
  <button id="micButton">🎙 Tap to Speak</button>
  <div id="status">Ready</div>
  <div id="chat" class="chat"></div>
</div>

<script>
/* ================= GLOBALS ================= */
let ws, audioCtx, scriptNode, mediaStream;
let micOn = false;

let playCtx = null;
let playQueue = [];
let playing = false;

const streamSid = "browser-" + Date.now();
let started = false;

/* ================= DOM ================= */
const micButton = document.getElementById("micButton");
const statusEl = document.getElementById("status");
const chatEl = document.getElementById("chat");

/* ================= HELPERS ================= */
function log(...args) {
  console.log(`[STREAM ${streamSid}]`, ...args);
}

function addMsg(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + role;
  d.textContent = text;
  chatEl.appendChild(d);
  chatEl.scrollTop = chatEl.scrollHeight;
}

/* ================= WS ================= */
function connectWS() {
  if (ws && ws.readyState === WebSocket.OPEN) return;

  const url =
    (location.protocol === "https:" ? "wss://" : "ws://") +
    location.host + "/exotel-media";

  ws = new WebSocket(url);

  ws.onopen = () => log("WS CONNECTED");
  ws.onclose = () => log("WS CLOSED");
  ws.onmessage = e => route(JSON.parse(e.data));
}

connectWS();

/* ================= MIC ================= */
micButton.onclick = () => micOn ? stopMic() : startMic();

async function startMic() {
  connectWS();

  micOn = true;
  micButton.textContent = "⏹ Stop";
  statusEl.textContent = "Listening";

  if (!started) {
    ws.send(JSON.stringify({
      event: "start",
      stream_sid: streamSid,
      start: {
        call_sid: "browser",
        media_format: { sample_rate: 8000 }
      }
    }));
    started = true;
  }

  mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  audioCtx = new AudioContext({ sampleRate: 24000 });
  await audioCtx.resume();

  const src = audioCtx.createMediaStreamSource(mediaStream);
  scriptNode = audioCtx.createScriptProcessor(2048, 1, 1);

  scriptNode.onaudioprocess = e => {
    if (!micOn || ws.readyState !== WebSocket.OPEN) return;

    const input = e.inputBuffer.getChannelData(0);
    const down = downsample(input, audioCtx.sampleRate, 8000);
    const pcm = floatToPCM(down);

    ws.send(JSON.stringify({
      event: "media",
      stream_sid: streamSid,
      media: { payload: pcmBase64(pcm) }
    }));
  };

  src.connect(scriptNode);
  scriptNode.connect(audioCtx.destination);
}

function stopMic() {
  micOn = false;
  micButton.textContent = "🎙 Tap to Speak";
  statusEl.textContent = "Processing";

  ws.send(JSON.stringify({ event: "stop", stream_sid: streamSid }));

  scriptNode?.disconnect();
  scriptNode = null;

  audioCtx?.close();
  audioCtx = null;

  mediaStream?.getTracks().forEach(t => t.stop());
  mediaStream = null;
}

/* ================= ROUTER ================= */
function route(msg) {

  /* 🔊 ASSISTANT AUDIO FROM SERVER */
  if (msg.event === "media" && msg.media?.payload) {
    const pcm = base64ToPCM16(msg.media.payload);
    const float = pcm16ToFloat32(pcm);
    queue(float);
    return;
  }

  /* 📝 USER TEXT */
  if (msg.type === "user_transcript") {
    if (msg.text?.trim()) addMsg("user", msg.text.trim());
    return;
  }

  /* 🤖 ASSISTANT TEXT */
  if (msg.type === "assistant_text") {
    if (msg.text?.trim()) addMsg("assistant", msg.text.trim());
    return;
  }
}

/* ================= AUDIO PLAYBACK ================= */
function queue(samples) {
  playQueue.push(samples);
  if (!playing) playNext();
}

function playNext() {
  if (!playQueue.length) {
    playing = false;
    statusEl.textContent = "Listening";
    return;
  }

  playing = true;
  statusEl.textContent = "Speaking";

  if (!playCtx) playCtx = new AudioContext({ sampleRate: 24000 });

  const samp = playQueue.shift();
  const buf = playCtx.createBuffer(1, samp.length, 24000);
  buf.getChannelData(0).set(samp);

  const src = playCtx.createBufferSource();
  src.buffer = buf;
  src.connect(playCtx.destination);
  src.start();
  src.onended = playNext;
}

/* ================= AUDIO UTILS ================= */
function downsample(buf, inRate, outRate) {
  const ratio = inRate / outRate;
  const len = Math.round(buf.length / ratio);
  const out = new Float32Array(len);
  let pos = 0;

  for (let i = 0; i < len; i++) {
    const next = Math.round((i + 1) * ratio);
    let sum = 0, count = 0;
    for (; pos < next && pos < buf.length; pos++) {
      sum += buf[pos];
      count++;
    }
    out[i] = sum / count;
  }
  return out;
}

function floatToPCM(f) {
  const out = new Int16Array(f.length);
  for (let i = 0; i < f.length; i++) {
    const s = Math.max(-1, Math.min(1, f[i]));
    out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
  }
  return out;
}

function pcmBase64(pcm) {
  return btoa(String.fromCharCode(...new Uint8Array(pcm.buffer)));
}

function base64ToPCM16(b64) {
  const bin = atob(b64);
  const buf = new Int16Array(bin.length / 2);
  for (let i = 0; i < buf.length; i++) {
    buf[i] = bin.charCodeAt(i * 2) | (bin.charCodeAt(i * 2 + 1) << 8);
  }
  return buf;
}

function pcm16ToFloat32(pcm) {
  const out = new Float32Array(pcm.length);
  for (let i = 0; i < pcm.length; i++) {
    out[i] = pcm[i] / 32768;
  }
  return out;
}
</script>
</body>
</html>
