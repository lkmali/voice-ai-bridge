<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Realtime Voice AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body { font-family: system-ui; background:#f8fafc; padding:20px }
    button { padding:12px 24px; border-radius:999px; background:#22c55e; color:white; border:none }
    #status { margin-top:8px; color:#64748b }
  </style>
</head>

<body>
  <button id="mic">🎙 Tap to Speak</button>
  <div id="status">Ready</div>

<script>
/* ================= STATE ================= */
let ws, micOn=false
let audioCtx, micStream, processor
let playCtx = null
let playQueue = []
let playing = false
const streamSid = "browser-" + Date.now()

/* ================= UI ================= */
const micBtn = document.getElementById("mic")
const statusEl = document.getElementById("status")

/* ================= WS ================= */
function connectWS() {
  if (ws?.readyState === WebSocket.OPEN) return

  ws = new WebSocket(
    (location.protocol === "https:" ? "wss://" : "ws://") +
    location.host + "/exotel-media"
  )

  ws.onmessage = e => route(JSON.parse(e.data))
}
connectWS()

/* ================= MIC ================= */
micBtn.onclick = () => micOn ? stopMic() : startMic()

async function startMic() {
  micOn = true
  micBtn.textContent = "⏹ Stop"
  statusEl.textContent = "Listening"
  connectWS()

  ws.send(JSON.stringify({ event:"start", stream_sid:streamSid }))

  micStream = await navigator.mediaDevices.getUserMedia({ audio:true })
  audioCtx = new AudioContext({ sampleRate:24000 })
  await audioCtx.resume()

  const src = audioCtx.createMediaStreamSource(micStream)
  processor = audioCtx.createScriptProcessor(2048,1,1)

  processor.onaudioprocess = e => {
    if (!micOn) return
    const input = e.inputBuffer.getChannelData(0)
    const pcm = floatToPCM16(downsample(input, audioCtx.sampleRate, 8000))

    ws.send(JSON.stringify({
      event:"media",
      stream_sid:streamSid,
      media:{ payload: pcmToBase64(pcm) }
    }))
  }

  src.connect(processor)
  processor.connect(audioCtx.destination)
}

function stopMic() {
  micOn = false
  micBtn.textContent = "🎙 Tap to Speak"
  statusEl.textContent = "Processing"
  ws.send(JSON.stringify({ event:"stop", stream_sid:streamSid }))
  processor?.disconnect()
  audioCtx?.close()
  micStream?.getTracks().forEach(t=>t.stop())
}

/* ================= ROUTER ================= */
function route(msg) {
  if (msg.event === "media" && msg.media?.payload) {
    const ulaw = base64ToUint8(msg.media.payload)
    const pcm = ulawToFloat32(ulaw)
    queue(pcm)
  }
}

/* ================= PLAYBACK ================= */
function queue(samples) {
  playQueue.push(samples)
  if (!playing) playNext()
}

async function playNext() {
  if (!playQueue.length) {
    playing = false
    statusEl.textContent = "Ready"
    return
  }

  playing = true
  statusEl.textContent = "Speaking 🔊"

  if (!playCtx) playCtx = new AudioContext({ sampleRate:8000 })
  if (playCtx.state === "suspended") await playCtx.resume()

  const samples = playQueue.shift()
  const buf = playCtx.createBuffer(1, samples.length, 8000)
  buf.getChannelData(0).set(samples)

  const src = playCtx.createBufferSource()
  src.buffer = buf
  src.connect(playCtx.destination)
  src.start()
  src.onended = playNext
}

/* ================= AUDIO UTILS ================= */
function downsample(buf, inRate, outRate) {
  const ratio = inRate / outRate
  const len = Math.round(buf.length / ratio)
  const out = new Float32Array(len)
  let pos = 0
  for (let i=0;i<len;i++) {
    const next = Math.round((i+1)*ratio)
    let sum=0,count=0
    for (;pos<next && pos<buf.length;pos++){sum+=buf[pos];count++}
    out[i]=sum/count
  }
  return out
}

function floatToPCM16(f) {
  const out = new Int16Array(f.length)
  for (let i=0;i<f.length;i++){
    const s=Math.max(-1,Math.min(1,f[i]))
    out[i]=s<0?s*0x8000:s*0x7fff
  }
  return out
}

function pcmToBase64(pcm){
  return btoa(String.fromCharCode(...new Uint8Array(pcm.buffer)))
}

function base64ToUint8(b64){
  return Uint8Array.from(atob(b64), c=>c.charCodeAt(0))
}

/* 🔥 g711 μ-law decoder */
function ulawToFloat32(ulaw) {
  const out = new Float32Array(ulaw.length)
  for (let i=0;i<ulaw.length;i++) {
    let u = ~ulaw[i]
    let sign = u & 0x80
    let exp = (u >> 4) & 0x07
    let mant = u & 0x0F
    let sample = ((mant<<1)+1)<< (exp+2)
    out[i] = (sign?-sample:sample)/32768
  }
  return out
}
</script>
</body>
</html>
