events {}

http {
    #################################################################
    # 1) HTTP server for Let's Encrypt challenge + redirect to HTTPS
    #################################################################

    server {
        listen 80;
        server_name voice.aiplustechnology.com;

        # Allow LetsEncrypt to verify SSL ownership
        location /.well-known/acme-challenge/ {
            root /var/www/html;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    #################################################################
    # 2) HTTPS server
    #################################################################

    server {
        listen 443 ssl;
        server_name voice.aiplustechnology.com;

        # SSL certificate paths (Let’s Encrypt)
        ssl_certificate /etc/letsencrypt/live/voice.aiplustechnology.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/voice.aiplustechnology.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        #############################################################
        # Main backend (Node.js) — serves your /public folder also
        #############################################################

        location / {
            proxy_pass http://app:3000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        #############################################################
        # WebSocket proxy (Exotel Media)
        #############################################################

        location /exotel-media {
            proxy_pass http://app:3000;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }

        #############################################################
        # API calls
        #############################################################

        location /api {
            proxy_pass http://app:3000;
        }
    }
}
