events {}

http {
    #################################################################
    # 1) HTTP server (ACME + redirect to HTTPS)
    #################################################################
    server {
        listen 80;
        server_name voice.aiplustechnology.com;

        # Allow Certbot renewals
        location /.well-known/acme-challenge/ {
            root /var/www/html;
        }

        # Redirect all traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    #################################################################
    # 2) HTTPS server (WSS + API + backend)
    #################################################################
    server {
        listen 443 ssl;
        server_name voice.aiplustechnology.com;

        ssl_certificate /etc/letsencrypt/live/voice.aiplustechnology.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/voice.aiplustechnology.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        #############################################################
        # WebSocket (use wss://voice.aiplustechnology.com/exotel-media)
        #############################################################
        location /exotel-media {
            proxy_pass http://app:3000;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }

        #############################################################
        # Backend API + Static files
        #############################################################
        location / {
            proxy_pass http://app:3000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
