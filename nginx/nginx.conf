events {}

http {
    # Backend service inside Docker
    upstream backend {
        server app:3000;
    }

    server {
        listen 80;
        server_name ec2-15-207-254-47.ap-south-1.compute.amazonaws.com;

        # ---- Serve frontend (HTML UI in ./frontend) ----
        location / {
            root /var/www/frontend;
            try_files $uri $uri/ /index.html;
        }

        # ---- WebSocket for Exotel ----
        location /exotel-media {
            proxy_pass http://backend;         # forwards to app:3000/exotel-media
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }

        # ---- API requests to Node backend ----
        location /api/ {
            proxy_pass http://backend;
        }
    }
}
