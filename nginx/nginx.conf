events {}

http {
    server {
        listen 80;
        server_name voice.aiplustechnology.com;

        # ACME challenge folder for Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/html;
        }

        # Temporary backend proxy (HTTP)
        location / {
            proxy_pass http://app:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
